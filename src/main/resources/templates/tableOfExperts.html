<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список экспертов</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            padding-bottom: 80px; /* Чтобы не перекрывать кнопки при прокрутке */
        }

        h1 {
            text-align: center;
            color: #333;
        }

        button {
            padding: 10px 20px;
            font-size: 14px;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px auto;
            background-color: #fff;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }

        th {
            background-color: #007bff;
            color: #fff;
        }

        tbody tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tbody tr:hover {
            background-color: #e9ecef;
        }

        tbody tr.selected {
            background-color: #d1ecf1;
        }

        /* Позиционирование кнопок внизу */
        .buttons-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            justify-content: center;
            z-index: 10;
        }

        .buttons-container button {
            margin: 0;
        }

        /* Стиль для поля поиска */
        .search-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .search-container input {
            padding: 8px;
            font-size: 14px;
            width: 300px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .search-container button {
            padding: 8px 16px;
            font-size: 14px;
            background-color: #007bff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 10px;
        }

        .search-container button:hover {
            background-color: #0056b3;
        }

    </style>
    <script>
        let selectedRow = null;

        // Загрузка данных экспертов
        async function loadExperts() {
            const resultsDiv = document.getElementById('results');
            try {
                const response = await fetch('/experts');
                const experts = await response.json();

                if (experts.length === 0) {
                    resultsDiv.innerHTML = '<tr><td colspan="4">Нет данных для отображения</td></tr>';
                    return;
                }

                updateTable(experts);
            } catch (error) {
                console.error("Ошибка загрузки данных:", error);
                resultsDiv.innerHTML = '<tr><td colspan="4">Ошибка загрузки данных.</td></tr>';
            }
        }

        // Обновление таблицы с данными
        function updateTable(experts) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = experts.map(expert => `
                <tr onclick="selectRow(this, ${expert.id})">
                    <td>${expert.fullName}</td>
                    <td>${expert.scientifiсDirection}</td>
                    <td>${expert.specialization}</td>
                </tr>
            `).join('');
        }

        // Выбор строки
        function selectRow(row, expertId) {
            if (selectedRow) {
                selectedRow.classList.remove('selected');
            }
            row.classList.add('selected');
            selectedRow = row;

            // Обновление URL для кнопок
            document.getElementById('editButton').action = `/edit/${expertId}`;
            document.getElementById('deleteButton').action = `/delete/${expertId}`;
            document.getElementById('downloadButton').action = `/download/${expertId}`;
        }

        // Функция для поиска
        function searchExperts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('#results tr');
            rows.forEach(row => {
                const nameCell = row.cells[0].textContent.toLowerCase();
                if (nameCell.includes(searchTerm)) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }
    </script>
</head>
<body>
<h1>Список экспертов</h1>

<!-- Поле поиска -->
<div class="search-container">
    <input type="text" id="searchInput" placeholder="Поиск по имени..." oninput="searchExperts()">
    <button onclick="searchExperts()">Поиск</button>
</div>

<table>
    <thead>
    <tr>
        <th>Имя, фамилия эксперта</th>
        <th>Научное направление (ОЭСР)</th>
        <th>Специализация</th>
    </tr>
    </thead>
    <tbody id="results">
    <!-- Данные будут загружаться сюда -->
    </tbody>
</table>

<!-- Контейнер с кнопками -->
<div class="buttons-container">
    <button onclick="loadExperts()">Показать все записи</button>
    <form action="/addExperts" method="get">
        <button type="submit">Добавить новую запись</button>
    </form>
    <form id="editButton" method="get">
        <button type="submit">Редактировать запись</button>
    </form>
    <form id="deleteButton" method="get">
        <button type="submit">Удалить запись</button>
    </form>
    <form id="downloadButton" method="get">
        <button type="submit">Сохранить запись в формате pdf</button>
    </form>
</div>

</body>
</html>
